name: Audit

# Windows runners provide both PowerShell 7 and Windows PowerShell 5.1, and this utility must load in both.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache installed modules
        uses: actions/cache@v4
        with:
          path: ~/Documents/PowerShell/Modules
          key: ps-modules-${{ runner.os }}-analyzer-pester

      - name: Install analysers
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          foreach ($module in 'PSScriptAnalyzer', 'Pester') {
              if (-not (Get-Module -ListAvailable -Name $module | Where-Object { $module -ne 'Pester' -or $_.Version.Major -ge 5 })) {
                  Install-Module -Name $module -Scope CurrentUser -Force -SkipPublisherCheck -MinimumVersion $(if ($module -eq 'Pester') { '5.0' } else { '1.21' })
              }
          }

      - name: Run tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = './Tests'
          $configuration.Run.Exit = $true
          $configuration.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $configuration
